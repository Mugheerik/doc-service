services:
  postgres:
    image: postgres:18
    container_name: doc-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_service
      POSTGRES_USER: doc_service
      POSTGRES_PASSWORD: doc_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
    container_name: doc-service-backend
    restart: unless-stopped
    environment:
      APPLICATION_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://doc_service:doc_service@postgres:5432/doc_service
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AI_API_KEY: ${AI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: doc-service-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: